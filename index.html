<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>دكان فاطمة وسماء</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2A1B4A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Baloo+Bhaijaan+2:wght@600;800&family=Readex+Pro:wght@400;500;700&display=swap">
<style>
[hidden]{display:none!important}

/* Sugar Ledger, v3. A toy market stall that can turn into a clinic or a treasure map.
   Awning over a stage where the action bursts in on a saffron sunburst; a plum display above it;
   a side sheet (receipt / patient chart / map) beside it; the girls' two bank cards along the bottom.
   Single deliberate bright look. */
:root{
  --ground:#EEE6FF; --ground-dot:#DCCEFF; --paper:#FFFFFF;
  --ink:#2A1B4A; --ink-soft:#6B5A8E;
  --pom:#F0374F; --pom-deep:#C21F38; --awning-light:#FFE3E8;
  --saffron:#FFB627; --saffron-soft:#FFE29A;
  --mint:#1FC3A4; --mint-deep:#0E8F78; --sky:#4BA3FF; --sky-deep:#1F6FD1;
  --lcd:#241640; --lcd-glow:#8CFFD9;
  --line:#E6DDF7;
  --fatima-a:#8E4DFF; --fatima-b:#E0479E;
  --sama-a:#13B6A5; --sama-b:#3D8BFF;
  --ok:#17A866;
  --mode:var(--pom); --mode-deep:var(--pom-deep); --mode-soft:var(--awning-light); --burst:var(--saffron-soft);
  --display-ar:"Baloo Bhaijaan 2","Baloo 2","Readex Pro",system-ui,sans-serif;
  --display-lat:"Baloo 2","Baloo Bhaijaan 2","Readex Pro",system-ui,sans-serif;
  --body:"Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --display:var(--display-ar);
  color-scheme:light;
}
:root[lang="en"],:root[lang="de"]{--display:var(--display-lat)}
body[data-mode="clinic"]{--mode:var(--mint);--mode-deep:var(--mint-deep);--mode-soft:#DDF8F1;--burst:#C9F5EA}
body[data-mode="detective"]{--mode:#8E4DFF;--mode-deep:#5B23C2;--mode-soft:#EFE6FF;--burst:#E3D5FF}
body[data-mode="treasure"]{--mode:var(--sky);--mode-deep:var(--sky-deep);--mode-soft:#DCEBFF;--burst:#FFE29A}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;
  background:var(--ground) radial-gradient(circle,var(--ground-dot) 1.6px,transparent 1.8px) 0 0/26px 26px}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:12px;
  padding-block:12px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sign{display:flex;align-items:center;gap:10px;background:var(--pom);color:#fff;border-radius:16px;padding:6px 18px 4px;box-shadow:0 5px 0 var(--pom-deep);transform:rotate(-1.2deg)}
.sign .logo{font-size:1.6rem;line-height:1}
.brand{font-family:var(--display);font-weight:800;font-size:clamp(1.25rem,2.5vw,1.9rem);line-height:1.15;margin:0;white-space:nowrap}
.modes{display:flex;gap:6px;background:var(--paper);padding:5px;border-radius:18px;box-shadow:0 3px 0 var(--line)}
.modes button{border:0;background:transparent;border-radius:13px;height:44px;padding:0 14px;display:flex;align-items:center;gap:7px;font-weight:700;font-size:.98rem}
.modes button .me{font-size:1.35rem}
.modes button[aria-pressed="true"]{background:var(--mode);color:#fff;box-shadow:0 3px 0 var(--mode-deep)}
.tools{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.langs{display:flex;background:var(--paper);border-radius:999px;padding:4px;gap:2px;box-shadow:0 3px 0 var(--line)}
.langs button{border:0;background:transparent;border-radius:999px;min-width:46px;height:38px;padding:0 12px;font-weight:700;font-size:.95rem}
.langs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.iconbtn{border:0;background:var(--paper);width:46px;height:46px;border-radius:14px;font-size:1.25rem;display:grid;place-items:center;box-shadow:0 3px 0 var(--line)}
.iconbtn:active,.langs button:active,.modes button:active{transform:translateY(2px)}

/* ---------- main ---------- */
.main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;min-height:0}
.stagecol{display:grid;grid-template-rows:auto 1fr;gap:12px;min-height:0}
.lcd{background:var(--lcd);color:var(--lcd-glow);border-radius:22px;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;
  box-shadow:inset 0 0 0 4px #1A0F31, inset 0 10px 30px #0000006b, 0 6px 0 #170D2B}
.lcd .label{font-size:.95rem;color:#CDBDF3}
.lcd .cash{font-size:.95rem;color:var(--saffron);min-height:1.3em;margin-top:2px}
.lcd .amount{display:flex;align-items:baseline;gap:8px;direction:ltr}
.lcd .total{font-family:var(--display-lat);font-weight:800;font-size:clamp(2.4rem,5.6vw,4rem);line-height:.95;font-variant-numeric:tabular-nums;text-shadow:0 0 18px #8CFFD966}
.lcd .unit{font-size:clamp(1.5rem,3.2vw,2.2rem);color:var(--saffron);text-shadow:0 0 14px #FFB62788}

.stage{position:relative;background:var(--paper);border-radius:26px;overflow:hidden;display:grid;place-items:center;text-align:center;padding:64px 20px 22px;min-height:0;box-shadow:0 6px 0 var(--line)}
.awning{position:absolute;inset:0 0 auto 0;height:52px;z-index:2;pointer-events:none}
.awning::before{content:"";position:absolute;inset:0 0 auto 0;height:30px;background:repeating-linear-gradient(90deg,var(--mode) 0 44px,var(--mode-soft) 44px 88px)}
.awning::after{content:"";position:absolute;inset:30px 0 auto 0;height:22px;
  background:radial-gradient(circle at 22px 0,var(--mode) 21px,transparent 22px),radial-gradient(circle at 66px 0,var(--mode-soft) 21px,transparent 22px);
  background-size:88px 22px;filter:drop-shadow(0 3px 0 #2A1B4A14)}
.burst{position:absolute;width:min(78vmin,620px);aspect-ratio:1;max-width:120%;border-radius:50%;top:56%;left:50%;translate:-50% -50%;
  background:repeating-conic-gradient(var(--burst) 0 9deg,transparent 9deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0 38%,#0000 70%);mask:radial-gradient(circle,#000 0 38%,#0000 70%);opacity:.9;animation:spin 60s linear infinite}
@keyframes spin{to{rotate:360deg}}
.stage-inner{position:relative;z-index:1;display:grid;justify-items:center;gap:6px;width:100%;max-height:100%;overflow:auto}
.big-emoji{font-size:clamp(4.6rem,13vw,9.5rem);line-height:1.05;filter:drop-shadow(0 14px 12px #2A1B4A2e)}
.mid-emoji{font-size:clamp(3rem,8vw,5.5rem);line-height:1.05}
.big-name{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,4.4vw,3rem);line-height:1.15;margin:0;text-wrap:balance}
.also{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.also span{background:var(--ground);border-radius:999px;padding:3px 12px;font-size:.95rem}
.also span b{font-weight:500;color:var(--ink-soft);margin-inline-end:6px;font-size:.78rem}
.tag{position:relative;display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:var(--pom);color:#fff;font-family:var(--display-lat);font-weight:800;
  font-size:clamp(1.5rem,3.4vw,2.4rem);line-height:1;padding:10px 26px 8px 22px;border-radius:12px;rotate:-4deg;box-shadow:0 5px 0 var(--pom-deep);direction:ltr}
.tag::before{content:"";width:12px;height:12px;border-radius:50%;background:#fff;margin-inline-end:6px;box-shadow:inset 0 1px 2px #0004}
.tag .s{color:var(--saffron)}
.tag.ok{background:var(--ok);box-shadow:0 5px 0 #0E7A49}
.hint{color:var(--ink-soft);font-size:1.1rem;max-width:34ch;line-height:1.6;margin:0}
.err .big-name{color:var(--pom)}
.pop .big-emoji,.pop .mid-emoji{animation:pop .5s cubic-bezier(.25,1.7,.45,1)}
.pop .tag{animation:swing 1s ease-out}
@keyframes pop{0%{transform:scale(.3) rotate(-15deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes swing{0%{rotate:12deg}40%{rotate:-9deg}70%{rotate:-2deg}100%{rotate:-4deg}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-12px)}45%{transform:translateX(10px)}70%{transform:translateX(-6px)}}
.pill{border:0;background:var(--mode);color:#fff;font-weight:700;font-size:1.05rem;border-radius:999px;padding:10px 20px;box-shadow:0 4px 0 var(--mode-deep)}
.pill.light{background:var(--ground);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 var(--mode-deep)}
.choice{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}

/* clinic */
.bubble{position:relative;background:var(--mode-soft);border-radius:20px;padding:10px 20px;font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,3vw,2rem);display:flex;align-items:center;gap:10px}
.bubble::before{content:"";position:absolute;top:-12px;left:50%;translate:-50% 0;border:12px solid transparent;border-top:0;border-bottom-color:var(--mode-soft)}
.slots{display:flex;gap:16px;margin-top:10px}
.slot{width:clamp(84px,12vw,120px);aspect-ratio:1;border-radius:24px;border:4px dashed var(--line);display:grid;place-items:center;font-size:clamp(2.4rem,6vw,3.6rem);background:var(--paper)}
.slot.filled{border:4px solid var(--mode);background:var(--mode-soft);animation:pop .45s cubic-bezier(.25,1.7,.45,1)}
.slot.ghost{opacity:.35;filter:grayscale(.4)}

/* treasure */
.riddle{background:var(--saffron-soft);border-radius:22px;padding:16px 22px;max-width:30ch;font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,3.2vw,2.1rem);line-height:1.35;rotate:-1deg;box-shadow:0 5px 0 #E8C25C}
.dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--sky)} .dots i.now{background:var(--saffron);box-shadow:0 0 0 4px #FFB62744}

/* ---------- side sheet ---------- */
.side{position:relative;background:var(--paper);border-radius:22px 22px 0 0;display:flex;flex-direction:column;min-height:0;padding:16px 18px 28px;rotate:.6deg;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 12px) no-repeat,radial-gradient(circle 9px at 50% 100%,#0000 97%,#000) bottom/18px 12px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 12px) no-repeat,radial-gradient(circle 9px at 50% 100%,#0000 97%,#000) bottom/18px 12px repeat-x}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rhead h2{font-family:var(--display);font-size:1.4rem;margin:0}
.rno{font-size:.8rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;direction:ltr}
.rsub{color:var(--ink-soft);font-size:.88rem;margin:2px 0 8px;min-height:1.2em}
.mission{background:var(--saffron-soft);border-radius:14px;padding:8px 10px;margin-bottom:8px;display:grid;gap:6px}
.mission .mt{font-weight:700;font-size:.95rem;display:flex;justify-content:space-between;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip-i{background:var(--paper);border-radius:999px;padding:3px 10px;font-size:.95rem}
.chip-i.got{background:var(--ok);color:#fff;text-decoration:line-through}
.items{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;min-height:0;border-top:2px dashed var(--line)}
.items li{display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px dashed var(--line);font-size:1.08rem}
.items li .e{font-size:1.6rem;text-align:center}
.items li .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.items li .p{font-variant-numeric:tabular-nums;font-weight:700;direction:ltr}
.items li .p.star::after{content:" ★";color:var(--saffron)}
.items li.new{background:#FFE29A66;border-radius:10px;animation:slidein .35s ease-out}
@keyframes slidein{from{transform:translateY(-8px);opacity:0}}
.empty{display:grid!important;grid-template-columns:1fr!important;place-items:center;gap:6px;color:var(--ink-soft);padding:24px 6px!important;text-align:center;line-height:1.6;border:0!important}
.empty .ee{font-size:2.2rem;opacity:.6}
.sum{display:flex;justify-content:space-between;align-items:baseline;border-top:3px solid var(--ink);margin-top:10px;padding-top:10px;font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums}
.side .pill{margin-top:10px;align-self:center}

/* ---------- bank cards ---------- */
.bank{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{position:relative;overflow:hidden;border-radius:20px;color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;min-height:78px;box-shadow:0 6px 0 #2A1B4A33}
.card.f{background:linear-gradient(120deg,var(--fatima-a),var(--fatima-b))}
.card.s{background:linear-gradient(120deg,var(--sama-a),var(--sama-b))}
.card::before{content:"★";position:absolute;font-size:150px;line-height:1;inset-inline-end:-18px;top:-38px;color:#ffffff22;rotate:14deg}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#ffffff40 50%,transparent 60%);translate:-120% 0}
.card.flash::after{animation:shine 1s ease-out}
.card.flash{animation:hop .7s}
@keyframes shine{to{translate:120% 0}}
@keyframes hop{30%{transform:translateY(-8px)}}
.chipm{width:40px;height:30px;border-radius:7px;flex:none;background:linear-gradient(135deg,#FFE7A3,#E0A92E);box-shadow:inset 0 0 0 2px #C99220}
.ctext{min-width:0;position:relative}
.who{font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1.05}
.last{font-size:.82rem;opacity:.92;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bal{position:relative;margin-inline-start:auto;text-align:end;direction:ltr;font-family:var(--display-lat);font-weight:800;font-size:clamp(1.7rem,3.6vw,2.5rem);line-height:1;font-variant-numeric:tabular-nums}
.bal .st{color:var(--saffron-soft);font-size:.7em}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#2A1B4Ad9;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--paper);color:var(--ink);border-radius:28px;padding:26px;width:min(580px,100%);max-height:100%;overflow-y:auto;text-align:center;box-shadow:0 10px 0 #170D2B66}
.sheet h3{font-family:var(--display);font-size:2.05rem;line-height:1.15;margin:4px 0 6px;text-wrap:balance}
.sheet p{line-height:1.7;margin:6px 0}
.welcome .big-emoji{font-size:5.5rem}
.welcome .langs{justify-content:center;width:max-content;margin:14px auto 0}
.cta{border:0;background:var(--pom);color:#fff;font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.2;padding:12px 36px 10px;border-radius:999px;margin-top:16px;box-shadow:0 6px 0 var(--pom-deep)}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pom-deep)}
.small{font-size:.86rem;color:var(--ink-soft)}
.ticket .paid{font-family:var(--display);font-weight:800;font-size:2.7rem;color:var(--ok);line-height:1.1}
.rlines{text-align:start;margin:14px 0;border-block:2px dashed var(--line);padding:8px 0;font-variant-numeric:tabular-nums}
.rlines div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.rlines .strong{font-weight:700;font-size:1.15rem}
.change{display:inline-block;background:var(--saffron-soft);border-radius:14px;padding:8px 16px;font-size:1.15rem}
.closed{background:linear-gradient(#2A1B4A,#3B2A6B);color:#fff}
.closed .sheet{background:transparent;color:#fff;box-shadow:none}
.moon{font-size:6rem;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.closed .gearlink{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-end:max(16px,env(safe-area-inset-right,0px));background:#ffffff22;color:#fff}

/* parent panel */
.panel{text-align:start}
.panel h3{text-align:center}
.panel section{border-top:1px solid var(--line);padding:14px 0;display:grid;gap:10px}
.panel h4{margin:0;font-size:1.02rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row label{min-width:4.5rem}
.row input,.row select{font:inherit;padding:8px 12px;border:2px solid var(--line);border-radius:12px;width:7rem;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--paper)}
.row input.wide{flex:1;min-width:0;width:auto}
.row select{width:auto}
.ghost{border:2px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:12px;font-size:.98rem}
.danger{border-color:var(--pom);color:var(--pom)}
.codes{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:.92rem}
.codes b{font-variant-numeric:tabular-nums;direction:ltr;text-align:start;white-space:nowrap}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline:0;margin-inline:auto;width:max-content;max-width:90%;background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;z-index:30}
img.fx.real{border-radius:18%;background:#fff;object-fit:contain;box-shadow:0 6px 18px #2A1B4A22}
img.fx{width:1em;height:1em;object-fit:contain;vertical-align:-.14em;display:inline-block;-webkit-user-drag:none;user-select:none}
.big-emoji img.fx,.mid-emoji img.fx{vertical-align:middle;filter:drop-shadow(0 14px 14px #2A1B4A30)}
.modes .me img.fx{width:1.15em;height:1.15em}
.gearwrap{position:relative}
.gearwrap svg{position:absolute;inset:-3px;width:calc(100% + 6px);height:calc(100% + 6px);pointer-events:none;rotate:-90deg}
.gearwrap circle{fill:none;stroke:var(--saffron);stroke-width:4;stroke-dasharray:151;stroke-dashoffset:151;stroke-linecap:round}
.gearwrap.holding circle{transition:stroke-dashoffset 1.1s linear;stroke-dashoffset:0}
.realrow{display:grid;grid-template-columns:40px minmax(0,1fr) 6.5rem auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.realrow img,.realrow .ri{width:40px;height:40px;border-radius:8px;object-fit:contain;background:#fff;font-size:28px;display:grid;place-items:center}
.realrow input{font:inherit;padding:6px 8px;border:2px solid var(--line);border-radius:10px;min-width:0;width:100%;color:var(--ink);background:var(--paper)}
.realrow .code{font-size:.72rem;color:var(--ink-soft);direction:ltr}
.famrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.famrow .ft{font-size:.92rem;line-height:1.4}
.famrow .ft small{display:block;color:var(--ok);font-size:.78rem}
.famrow .fb{display:flex;gap:6px}
.famrow .ghost{padding:6px 10px}
.rec{border-color:var(--pom);color:var(--pom)}
.rec.on{background:var(--pom);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
[data-say]{cursor:pointer;-webkit-tap-highlight-color:transparent}
.said{animation:said .45s ease-out}
@keyframes said{40%{transform:scale(1.06)}}
.tapw{display:contents}
/* ---- food detective ---- */
.det{width:min(100%,760px);display:grid;gap:12px;text-align:start;justify-items:stretch}
.det-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.det-img{width:clamp(96px,16vw,150px);aspect-ratio:1;border-radius:22px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 8px 24px #2A1B4A22;font-size:4rem}
.det-img img{width:100%;height:100%;object-fit:contain}
.det-id .big-name{font-size:clamp(1.4rem,3.4vw,2.2rem);text-align:start}
.det-id .hint{max-width:none;font-size:.95rem}
.verdict{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:8px 18px;font-family:var(--display);font-weight:800;font-size:clamp(1.1rem,2.6vw,1.5rem);margin-top:6px;color:#fff}
.v-green{background:#1E9E5A;box-shadow:0 4px 0 #11713E} .v-yellow{background:#F2A900;box-shadow:0 4px 0 #B87F00;color:#2A1B4A} .v-red{background:#E63E3E;box-shadow:0 4px 0 #A92525} .v-unknown{background:#9A8DB8;box-shadow:0 4px 0 #6B5A8E}
.guess{background:var(--mode-soft);border-radius:20px;padding:14px;text-align:center;display:grid;gap:8px}
.guess .q{font-family:var(--display);font-weight:800;font-size:clamp(1.15rem,2.8vw,1.6rem);margin:0}
.guess .pill{min-width:76px;font-size:1.35rem}
.cubes{background:#fff;border:2px dashed var(--line);border-radius:20px;padding:12px 14px;display:grid;gap:8px}
.cubes .lbl{font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cubes .row{display:flex;flex-wrap:wrap;gap:5px;direction:ltr}
.cube{width:22px;height:22px;border-radius:5px;background:linear-gradient(135deg,#fff 0%,#F3EEFF 55%,#D9CFF2 100%);box-shadow:inset 0 0 0 1.5px #CFC2EE,0 2px 0 #CFC2EE;animation:drop .35s backwards}
@keyframes drop{from{transform:translateY(-14px);opacity:0}}
.more{font-weight:800;color:var(--ink-soft);align-self:center}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.fact{background:#fff;border-radius:18px;padding:10px 12px;box-shadow:0 3px 0 var(--line);display:grid;gap:6px;align-content:start}
.fact h5{margin:0;font-size:.85rem;color:var(--ink-soft);font-weight:600}
.ns{display:flex;gap:3px;direction:ltr}
.ns span{flex:1;text-align:center;border-radius:6px;font-weight:800;color:#fff;padding:3px 0;opacity:.35;font-family:var(--display-lat)}
.ns span.on{opacity:1;transform:scale(1.18);box-shadow:0 3px 8px #0003}
.ns .a{background:#038141}.ns .b{background:#85BB2F}.ns .c{background:#FECB02;color:#2A1B4A}.ns .d{background:#EE8100}.ns .e{background:#E63E11}
.nova{display:flex;gap:4px;direction:ltr}.nova i{flex:1;height:10px;border-radius:5px;background:var(--line)}
.nova i.on{background:var(--mode)}
.chips2{display:flex;flex-wrap:wrap;gap:6px}
.chip2{border-radius:999px;padding:4px 10px;font-size:.88rem;background:var(--ground);display:inline-flex;gap:5px;align-items:center}
.lv-low{background:#DDF5E7;color:#11713E}.lv-moderate{background:#FFF0C7;color:#7A5600}.lv-high{background:#FFE0E0;color:#A92525}
.halal{border-radius:18px;padding:10px 12px;display:grid;gap:6px}
.halal.ok{background:#E6F7EE}.halal.warn{background:#FFF1D6}.halal.info{background:var(--ground)}
.ingr{background:#fff;border-radius:18px;padding:10px 14px;box-shadow:0 3px 0 var(--line)}
.ingr summary{cursor:pointer;font-weight:700}
.ingr p{line-height:1.7;font-size:.92rem;margin:8px 0 0}
.addl{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:4px;font-size:.9rem}
.addl b{direction:ltr;display:inline-block;min-width:4.2em}
.src{font-size:.78rem;color:var(--ink-soft)}
.rank{background:linear-gradient(120deg,var(--mode),var(--mode-deep));color:#fff;border-radius:16px;padding:10px 12px;margin-bottom:8px;display:grid;gap:6px}
.rank .bar{height:8px;border-radius:4px;background:#ffffff40;overflow:hidden}.rank .bar i{display:block;height:100%;background:var(--saffron)}
.win{background:#FFF6D6;border-radius:12px;padding:6px 10px;margin-bottom:8px;font-size:.92rem}
@media (max-width:600px){ .det-top{grid-template-columns:1fr;justify-items:center;text-align:center} .det-id .big-name{text-align:center} }
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:25;width:100%;height:100%}

@media (max-width:980px){ .modes button .ml{display:none} .modes button{padding:0 12px} }

}

}

const VOICE_BASE = "voice/";
let VM = null;   // manifest: {ar:{key:text}, en:{...}, de:{...}}
let voices = [];
function loadVoices(){ if("speechSynthesis" in window){ voices = speechSynthesis.getVoices(); renderVoiceInfo(); } }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function voiceFor(lang){ const re = L[lang].voice; return voices.find(v=>re.test(v.lang) && /google|enhanced|premium|natural/i.test(v.name)) || voices.find(v=>re.test(v.lang)) || null; }
function ttsSay(text){
  if(!S.voice || !text) return; const v = voiceFor(S.lang); if(!v) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.voice=v; u.lang=v.lang; u.rate=.98; u.pitch=1.1; speechSynthesis.speak(u); }catch(e){}
}
fetch(VOICE_BASE+"manifest.json").then(r=>r.ok?r.json():null).then(m=>{ VM = m; renderVoiceInfo(); }).catch(()=>{});
const bufCache = new Map();
function clipBuf(lang, key){
  const id = lang+"/"+key;
  if(bufCache.has(id)) return bufCache.get(id);
  const pr = (async ()=>{
    let ab = null;
    const fam = await famGet(lang, key);
    if(fam) ab = await fam.arrayBuffer();
    else{
      if(!VM || !VM[lang] || !(key in VM[lang]) || VM[lang][key]==="") return null;
      const r = await fetch(VOICE_BASE+lang+"/"+key+".mp3"); if(!r.ok) return null;
      ab = await r.arrayBuffer();
    }
    const ac = audio(); if(!ac) return null;
    return await new Promise((res)=>ac.decodeAudioData(ab, res, ()=>res(null)));
  })().catch(()=>null);
  bufCache.set(id, pr); pr.then(b=>{ if(!b) bufCache.delete(id); });
  return pr;
}
let speakGen = 0, liveSrc = [];
function stopSpeech(){ liveSrc.forEach(x=>{ try{ x.stop(); }catch(e){} }); liveSrc = []; try{ speechSynthesis.cancel(); }catch(e){} }
function ttsPromise(text){
  return new Promise(res=>{
    const v = voiceFor(S.lang); if(!v || !text){ res(); return; }
    try{ const u = new SpeechSynthesisUtterance(text); u.voice=v; u.lang=v.lang; u.rate=.98; u.pitch=1.1;
      const done = ()=>{ clearTimeout(t); res(); }; const t = setTimeout(done, 1500 + text.length*110);
      u.onend = done; u.onerror = done; speechSynthesis.speak(u); }catch(e){ res(); }
  });
}
async function speak(tokens, fallback){
  if(!S.voice) return;
  const gen = ++speakGen, lang = S.lang; stopSpeech();
  if(!tokens || tokens.some(k=>k==null)){ ttsSay(fallback); return; }
  const keys = tokens.filter(k=>!(VM && VM[lang] && VM[lang][k]===""));
  const clipKeys = keys.filter(k=>!k.startsWith("t:"));
  const famAny = await famHasAny(lang, clipKeys);
  if(gen!==speakGen) return;
  if(!(VM && VM[lang]) && !famAny){ ttsSay(fallback); return; }
  const parts = await Promise.all(keys.map(k=>k.startsWith("t:") ? Promise.resolve(k.slice(2)) : clipBuf(lang,k)));
  if(gen!==speakGen) return;
  if(!parts.every(x=>x)){ ttsSay(fallback); return; }
  const ac = audio();
  for(let i=0; i<parts.length; i++){
    if(gen!==speakGen) return;
    if(typeof parts[i]==="string"){ await ttsPromise(parts[i]); continue; }
    let t = ac.currentTime + .03, j = i;
    while(j<parts.length && typeof parts[j]!=="string"){
      const src = ac.createBufferSource(); src.buffer = parts[j]; const g = ac.createGain(); g.gain.value = 1.15;
      src.connect(g).connect(ac.destination); src.start(t); liveSrc.push(src); t += parts[j].duration + (j<parts.length-1 ? .09 : 0); j++;
    }
    await new Promise(r=>setTimeout(r, Math.max(0, (t-ac.currentTime)*1000)));
    i = j-1;
  }
}
function warmVoices(){
  if(!VM || !VM[S.lang]) return;
  const lang = S.lang;
  const keys = Object.keys(VM[lang]).filter(k=>VM[lang][k]!=="" && (!/^n_\d+$/.test(k) || +k.slice(2) <= 40));
  let i = 0;
  const next = ()=>{ if(i >= keys.length || lang !== S.lang) return; const k = keys[i++]; fetch(VOICE_BASE+lang+"/"+k+".mp3").catch(()=>{}).finally(()=>setTimeout(next, 60)); };
  for(let j=0;j<3;j++) setTimeout(next, 1500 + j*200);
}

let famDB = null, famKeysCache = null;
function famOpen(){
  if(famDB) return famDB;
  famDB = new Promise((res)=>{ try{ const r = indexedDB.open("dukkan", 2); r.onupgradeneeded = ()=>{ const db = r.result; if(!db.objectStoreNames.contains("voices")) db.createObjectStore("voices"); if(!db.objectStoreNames.contains("catalog")) db.createObjectStore("catalog", {keyPath:"code"}); }; r.onsuccess = ()=>res(r.result); r.onerror = ()=>res(null); }catch(e){ res(null); } });
  return famDB;
}
async function famTx(mode, fn){ const db = await famOpen(); if(!db) return null; return new Promise((res)=>{ try{ const tx = db.transaction("voices", mode); const st = tx.objectStore("voices"); const rq = fn(st); rq.onsuccess = ()=>res(rq.result); rq.onerror = ()=>res(null); }catch(e){ res(null); } }); }
async function famKeys(){ if(!famKeysCache){ famKeysCache = new Set((await famTx("readonly", st=>st.getAllKeys())) || []); } return famKeysCache; }
async function famHasAny(lang, keys){ const k = await famKeys(); return keys.some(x=>k.has(lang+"/"+x)); }
async function famGet(lang, key){ const k = await famKeys(); if(!k.has(lang+"/"+key)) return null; return famTx("readonly", st=>st.get(lang+"/"+key)); }
async function famSet(lang, key, blob){ await famTx("readwrite", st=>st.put(blob, lang+"/"+key)); (await famKeys()).add(lang+"/"+key); bufCache.delete(lang+"/"+key); }
async function famDel(lang, key){ await famTx("readwrite", st=>st.delete(lang+"/"+key)); (await famKeys()).delete(lang+"/"+key); bufCache.delete(lang+"/"+key); }

async function imgToData(url){
  try{ const r = await fetch(url); if(!r.ok) return url; const b = await r.blob();
    return await new Promise(res=>{ const fr = new FileReader(); fr.onload = ()=>res(fr.result); fr.onerror = ()=>res(url); fr.readAsDataURL(b); }); }catch(e){ return url; }
}
async function addReal(code){
  const p = await lookupReal(code);
  const rec = await recFromProduct(code, p);
  if(p) rec.info = buildInfo(p);
  await catPut(rec); return rec;
}
async function recFromProduct(code, p){
  const any = p ? (p.product_name || p.generic_name || p.product_name_en || p.product_name_de || p.product_name_ar || "") : "";
  const tail = code.slice(-4);
  const pn = k => (p && p[k]) || "";   /* we live in Germany: German name is the best fallback */
  const names = { ar: pn("product_name_ar") || pn("product_name_de") || pn("product_name_en") || any || ("منتج "+tail), en: pn("product_name_en") || pn("product_name_de") || any || ("Product "+tail), de: pn("product_name_de") || pn("product_name_en") || any || ("Produkt "+tail) };
  const imgUrl = p && (p.image_front_small_url || p.image_front_url);
  const rec = { code, schema:1, src: p ? "openfoodfacts" : "manual", names, brand: (p && p.brands) || "", qty: (p && p.quantity) || "",
    base: estimatePrice(p && p.categories_tags), img: imgUrl ? await imgToData(imgUrl) : "", added: Date.now() };
  return rec;
}
function buildInfo(p){
  const n = p.nutriments || {};
  const num = k => { const v = n[k]; if(v===undefined || v===null || v==="") return null; const f = typeof v==="number" ? v : parseFloat(v); return isNaN(f) ? null : f; };
  return { at: Date.now(),
    ns: /^[a-e]$/.test(p.nutriscore_grade||"") ? p.nutriscore_grade : null,
    nova: [1,2,3,4].includes(+p.nova_group) ? +p.nova_group : null,
    n: { sugars:num("sugars_100g"), fat:num("fat_100g"), sat:num("saturated-fat_100g"), salt:num("salt_100g"), kcal:num("energy-kcal_100g") },
    levels: p.nutrient_levels || {}, allergens: p.allergens_tags || [], traces: p.traces_tags || [], additives: p.additives_tags || [],
    ingr: { ar:p.ingredients_text_ar||"", en:p.ingredients_text_en||"", de:p.ingredients_text_de||"", any:p.ingredients_text||"" },
    itags: p.ingredients_tags || [], analysis: p.ingredients_analysis_tags || [], labels: p.labels_tags || [],
    serving: +p.serving_quantity > 0 ? +p.serving_quantity : null, imgBig: p.image_front_url || "" };
}
async function getFoodInfo(code){
  let rec = REAL[code];
  if(rec && rec.info && Date.now() - (rec.info.at||0) < 30*864e5) return rec;
  const p = await lookupReal(code, DET_FIELDS);
  if(!p) return rec && rec.info ? rec : null;
  if(!rec) rec = await recFromProduct(code, p);
  rec.info = buildInfo(p); rec.schema = 2; await catPut(rec); return rec;
}

const normalize = s => String(s).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/\D/g,"");

function handle(raw){
  const code = normalize(raw); if(!code || closed) return;
  if(pending && Date.now()>pending.until) pending = null;

  // mode cards and universal controls work everywhere
  const act = CTRL[code];
  if(act && act.startsWith("m:")){ setMode(act.slice(2)); return; }

  // cards from another mode switch to it automatically
  if(isEAN(code) && S.mode==="detective"){ /* stay: the detective examines real products */ }
  else if(isProduct(code) || isEAN(code) || moneyCard(code) || act==="undo" || act==="mission" || act==="bonus" || act==="balance"){ if(S.mode!=="shop") setMode("shop", false); }
  if(PATIENTS[code] || MEDS[code]){ if(S.mode!=="clinic") setMode("clinic", false); }
  if(SPOTS[code]){ if(S.mode!=="treasure") setMode("treasure", false); }

  if(S.mode==="detective") return handleDetective(code, act);
  if(S.mode==="clinic") return handleClinic(code, act);
  if(S.mode==="treasure") return handleTreasure(code, act);
  handleShop(code, act);
}

/* ================= Scanner input =================
   Works whether or not the scanner sends Enter (Zebra's default is "data as is", no suffix):
   digits are collected and committed on Enter/Tab OR after a short pause.
   A hidden input (inputmode=none, no soft keyboard) catches keys that Android delivers
   as IME input ("Unidentified"/229) instead of normal key events. */
let buf = "", lastKey = 0, commitT = null, lastRaw = "";
const DIGITS = "0123456789", AR_D = "٠١٢٣٤٥٦٧٨٩", FA_D = "۰۱۲۳۴۵۶۷۸۹";
function toDigit(ch){ if(DIGITS.includes(ch)) return ch; let i = AR_D.indexOf(ch); if(i>=0) return String(i); i = FA_D.indexOf(ch); return i>=0 ? String(i) : ""; }
function commit(){
  clearTimeout(commitT); commitT = null;
  const c = buf; buf = "";
  if(c.length < 4) return;
  lastRaw = c; noteScan();
  if(closed) return;
  if(!$("startOv").hidden) startGame();
  if(!$("panelOv").hidden) closePanel();
  handle(c);
}
function pushDigits(str){
  const now = Date.now(); if(now - lastKey > 800) buf = ""; lastKey = now;
  for(const ch of str){ const d = toDigit(ch); if(d) buf += d; }
  clearTimeout(commitT); commitT = setTimeout(commit, 180);
}
function inPanelField(t){ return t && t !== scanIn && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName); }
document.addEventListener("keydown", e=>{
  if(inPanelField(e.target)) return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key==="Enter" || e.key==="Tab" || e.keyCode===13){ if(buf){ e.preventDefault(); commit(); } return; }
  let ch = (e.key && e.key.length===1) ? e.key : "";
  if(!toDigit(ch) && e.code){ const m = /^(?:Digit|Numpad)(\d)$/.exec(e.code); if(m) ch = m[1]; }
  if(toDigit(ch)){ e.preventDefault(); pushDigits(ch); }
}, true);
/* hidden catcher for IME-delivered keystrokes */
const scanIn = document.createElement("input");
scanIn.setAttribute("inputmode","none"); scanIn.setAttribute("autocomplete","off"); scanIn.setAttribute("aria-hidden","true"); scanIn.tabIndex = -1;
scanIn.style.cssText = "position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none";
document.body.appendChild(scanIn);
scanIn.addEventListener("input", ()=>{ const v = scanIn.value; scanIn.value = ""; if(v) pushDigits(v); });
function focusScan(){ if($("panelOv").hidden && document.activeElement !== scanIn){ try{ scanIn.focus({preventScroll:true}); }catch(e){} } }
document.addEventListener("pointerup", focusScan);   /* synchronous: iOS only allows focus inside the tap itself */

/* ================= Confetti (stars + ribbons) ================= */
const fxc = $("fx"), ctx = fxc.getContext("2d"); let parts=[], raf=null;
function confetti(colors){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const d = devicePixelRatio||1; fxc.width = innerWidth*d; fxc.height = innerHeight*d;
  const cols = colors || ["#F0374F","#FFB627","#8E4DFF","#1FC3A4","#4BA3FF","#E0479E","#FFFFFF"];
  for(let i=0;i<170;i++) parts.push({x:fxc.width*(.3+Math.random()*.4), y:fxc.height*.5, vx:(Math.random()-.5)*28*d, vy:(-Math.random()*24-9)*d,
    r:(Math.random()*7+5)*d, c:cols[i%cols.length], a:Math.random()*6, s:Math.random()<.3, life:0});
  if(!raf) tick();
}
function star(r){ ctx.beginPath(); for(let i=0;i<10;i++){ const rr = i%2? r*.45 : r; const a = i*Math.PI/5 - Math.PI/2; ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); } ctx.closePath(); ctx.fill(); }
function tick(){
  const d = devicePixelRatio||1; ctx.clearRect(0,0,fxc.width,fxc.height);
  parts.forEach(p=>{ p.vy += .9*d; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.a += .18; p.life++;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; if(p.s) star(p.r*.9); else ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); });
  parts = parts.filter(p=>p.y < fxc.height+50 && p.life < 260);
  raf = parts.length ? requestAnimationFrame(tick) : (ctx.clearRect(0,0,fxc.width,fxc.height), null);
}

$("famList").addEventListener("click", async e=>{
  const b = e.target.closest("[data-fam]"); if(!b) return;
  const k = b.dataset.k, act = b.dataset.fam, lang = S.lang; audio();
  if(act==="play"){ speak([k], (VM && VM[lang] && VM[lang][k]) || ""); return; }
  if(act==="del"){ await famDel(lang, k); renderFamily(); return; }
  if(recState && recState.key===k){ recState.rec.stop(); return; }
  if(recState) return;

    const rec = new MediaRecorder(stream); const chunks = [];
    rec.ondataavailable = ev=>{ if(ev.data.size) chunks.push(ev.data); };
    rec.onstop = async ()=>{ stream.getTracks().forEach(tr=>tr.stop()); const blob = new Blob(chunks, {type: rec.mimeType || "audio/webm"});
      recState = null; if(blob.size > 1500) await famSet(lang, k, blob); renderFamily(); };
    recState = {key:k, rec}; rec.start(); renderFamily();
    setTimeout(()=>{ if(recState && recState.rec===rec) rec.stop(); }, 8000);
  }catch(err){ recState = null; toast(T().micNo); renderFamily(); }
});
function closePanel(){ $("panelOv").hidden = true; if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); setTimeout(focusScan, 50); }
$("closePanel").onclick = closePanel;
$("manualBtn").onclick = ()=>{ const v = $("manualCode").value; $("manualCode").value = ""; closePanel(); if(!$("startOv").hidden) startGame(); handle(v); };
$("manualCode").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); $("manualBtn").click(); } });
$("saveBal").onclick = ()=>{
  const rd = x => { const n = parseFloat(String(x).replace(",", ".")); return isNaN(n) ? NaN : Math.round(C().dec ? n*100 : n); };
  const f = rd($("bal9001").value), s = rd($("bal9002").value);
  if(isNaN(f)||isNaN(s)||f<0||s<0){ toast(T().badNum); return; }
  S.balances["9001"]=f; S.balances["9002"]=s; save(); render(); toast(T().saved);
};
$("limitSel").onchange = e=>{ S.limit = +e.target.value; save(); if(!sessionStart) sessionStart = Date.now(); renderPanel(); };
$("reopenBtn").onclick = ()=>{ reopen(); renderPanel(); };
function setCurrency(nc){
  const oc = S.currency; if(nc===oc || !CUR[nc]) return;
  const o = CUR[oc], n = CUR[nc];
  Object.keys(S.balances).forEach(k=>{ const eur = (o.dec ? S.balances[k]/100 : S.balances[k]) / o.rate; const maj = eur * n.rate;
    S.balances[k] = Math.max(0, n.dec ? Math.round(maj*10)*10 : Math.round(maj)); });
  S.currency = nc; cart = []; cash = 0; mission = null; pending = null; save();
  render(); view(modeIdleView()); toast(T().currencySet(n.flag+" "+n.name[S.lang]));
}
$("guessChk").onchange = e=>{ S.detGuess = e.target.checked; save(); };
$("halalChk").onchange = e=>{ S.halal = e.target.checked; save(); if(S.mode==="detective" && det) view(V.detCard, ""); };
$("curSel").onchange = e=>{ setCurrency(e.target.value); renderPanel(); };
$("simpleChk").onchange = e=>{ S.simple = e.target.checked; save(); render(); };
function renderReal(){
  const t = T(), codes = Object.keys(REAL).sort((a,b)=>(REAL[b].added||0)-(REAL[a].added||0));
  $("realList").innerHTML = codes.length ? codes.map(c=>{ const r = REAL[c], p = priceOf(c);
    return '<div class="realrow" data-code="'+c+'">'+(r.img?'<img src="'+esc(r.img)+'" alt="">':'<span class="ri">📦</span>')+
      '<div><input type="text" data-f="name" value="'+esc(pname(c))+'" aria-label="name"><div class="code">'+c+(r.brand?' · '+esc(r.brand):'')+'</div></div>'+
      '<input type="number" data-f="price" min="0" step="'+(C().dec?"0.01":"1")+'" value="'+(C().dec ? (p/100).toFixed(2) : p)+'" aria-label="price">'+
      '<button class="ghost danger" type="button" data-f="del">'+t.delBtn+'</button></div>'; }).join("")
    : '<p class="small">'+t.noReal+'</p>';
}
$("realList").addEventListener("change", async e=>{
  const row = e.target.closest(".realrow"); if(!row) return; const c = row.dataset.code, r = REAL[c]; if(!r) return;
  if(e.target.dataset.f==="name"){ r.names[S.lang] = e.target.value.trim() || r.names[S.lang]; }
  if(e.target.dataset.f==="price"){ const n = parseFloat(String(e.target.value).replace(",", ".")); if(!isNaN(n) && n>=0) r.base = baseFromPrice(Math.round(C().dec ? n*100 : n)); }
  await catPut(r); render();
});
$("realList").addEventListener("click", async e=>{
  const b = e.target.closest('[data-f="del"]'); if(!b) return; const c = b.closest(".realrow").dataset.code;
  await catDel(c); cart = cart.filter(x=>x!==c); render(); renderReal();
});
$("exportBtn").onclick = ()=>{
  const data = { app:"dukkan", schema:1, exported:new Date().toISOString(), catalog:Object.values(REAL),
    state:{ balances:S.balances, currency:S.currency, simple:S.simple, history:S.history, healed:S.healed } };
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], {type:"application/json"}));
  a.download = "dukkan-backup-"+new Date().toISOString().slice(0,10)+".json"; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
};
$("importFile").onchange = async e=>{
  const f = e.target.files && e.target.files[0]; if(!f) return;
  try{ const d = JSON.parse(await f.text()); const list = Array.isArray(d.catalog) ? d.catalog : [];
    for(const r of list){ if(r && r.code) await catPut(r); }
    if(d.state && d.state.currency && CUR[d.state.currency]){ Object.assign(S, {balances:d.state.balances||S.balances, currency:d.state.currency, simple:!!d.state.simple}); save(); }
    toast(T().imported(list.length)); render(); renderPanel();
  }catch(err){ toast(T().badNum); }
  e.target.value = "";
};
$("voiceBtn").onclick = ()=>{ S.voice=!S.voice; save(); renderPanel(); };
$("sfxBtn").onclick = ()=>{ S.sfx=!S.sfx; save(); renderPanel(); };
function resetUI(confirming){
  const t = T(), row = $("resetRow");
  row.innerHTML = confirming
    ? '<span>'+t.resetAsk+'</span><button class="ghost danger" type="button" id="resetYes">'+t.resetYes+'</button><button class="ghost" type="button" id="resetNo">'+t.cancel+'</button>'
    : '<button class="ghost danger" type="button" id="resetBtn">'+t.reset+'</button>';
  if(confirming){
    $("resetYes").onclick = ()=>{ const keep={voice:S.voice,sfx:S.sfx,lang:S.lang,mode:S.mode,limit:S.limit,clues:S.clues,currency:S.currency,simple:S.simple}; S = Object.assign(defaults(), keep); S.balances = {"9001":C().start,"9002":C().start}; save();
      cart=[]; cash=0; pending=null; mission=null; clinic=null; hunt=null; render(); view(modeIdleView()); renderPanel(); toast(T().resetDone); };
    $("resetNo").onclick = ()=>resetUI(false);
  } else $("resetBtn").onclick = ()=>resetUI(true);
}

/* ================= Boot ================= */
document.querySelectorAll(".welcome .big-emoji, .moon, .sign .logo").forEach(el=>{ el.innerHTML = fx(el.innerHTML); });
if(migrateStars){ setCurrency("EUR"); }
lastView = modeIdleView(); applyLang(); drawView("");
catLoad().then(()=>{ render(); });
if("serviceWorker" in navigator && location.protocol==="https:" && /github\.io$/.test(location.hostname)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
